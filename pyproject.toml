[project]
name = "fire"
version = "1.0.0"
description = "San Francisco fire incidents: incremental ingestion and a tested dbt warehouse on Postgres"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.10,<2",
    "dbt-postgres>=1.9,<2",
    "psycopg[binary]>=3.2,<4",
    "requests>=2.32,<3",
]

[project.scripts]
fire = "fire.cli:main"

[dependency-groups]
dev = ["pytest>=8", "responses>=0.25", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
