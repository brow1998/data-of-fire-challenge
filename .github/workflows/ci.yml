name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: fire
          POSTGRES_PASSWORD: fire
          POSTGRES_DB: fire
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fire -d fire"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: fire
      PGPASSWORD: fire
      PGDATABASE: fire
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Tests (recorded API pages, no live calls)
        run: uv run pytest -q
      - name: dbt project parses
        run: uv run dbt parse --project-dir dbt --profiles-dir dbt
